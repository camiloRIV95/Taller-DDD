services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rica
      POSTGRES_USER: rica
      POSTGRES_PASSWORD: rica
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
volumes:
  postgres_data:
  mongo_data:
